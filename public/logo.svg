<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <!-- Background -->
  <rect width="400" height="300" fill="transparent" />
  
  <!-- The M Icon -->
  <g transform="translate(100, 40)">
    <!-- Left Dark Blue -->
    <polygon points="0,50 0,140 40,110 40,75" fill="#001C44" />
    <!-- Left Light Blue -->
    <polygon points="0,0 0,50 40,75 100,120" fill="#0052FF" />
    <!-- Right Dark Blue -->
    <polygon points="200,50 200,140 160,110 160,75" fill="#001C44" />
    <!-- Right Light Blue -->
    <polygon points="200,0 200,50 160,75 100,120" fill="#0052FF" />
    
    <!-- Nodes and Lines (constellation) -->
    <path d="M 20,95 L 40,85 L 60,105 L 100,120 L 140,80 L 170,100" fill="none" stroke="#E0E7FF" stroke-width="1.5" />
    <path d="M 40,85 L 80,60 L 100,120 M 140,80 L 130,50 L 100,120" fill="none" stroke="#E0E7FF" stroke-width="1" stroke-dasharray="2 2" />
    
    <circle cx="20" cy="95" r="3" fill="#FFFFFF" />
    <circle cx="40" cy="85" r="2.5" fill="#FFFFFF" />
    <circle cx="60" cy="105" r="3" fill="#FFFFFF" />
    <circle cx="80" cy="60" r="2.5" fill="#FFFFFF" />
    <circle cx="100" cy="120" r="3.5" fill="#FFFFFF" />
    <circle cx="130" cy="50" r="2.5" fill="#FFFFFF" />
    <circle cx="140" cy="80" r="3" fill="#FFFFFF" />
    <circle cx="170" cy="100" r="3" fill="#FFFFFF" />
  </g>

  <!-- Text: MIHORA -->
  <text x="200" y="220" font-family="Arial, sans-serif" font-weight="900" font-size="44" fill="#001C44" text-anchor="middle" letter-spacing="4">MIHORA</text>
  
  <!-- Text: TECH with lines -->
  <g transform="translate(100, 240)">
    <line x1="10" y1="5" x2="65" y2="5" stroke="#0052FF" stroke-width="2" />
    <text x="100" y="10" font-family="Arial, sans-serif" font-weight="bold" font-size="16" fill="#0052FF" text-anchor="middle" letter-spacing="10">TECH</text>
    <line x1="135" y1="5" x2="190" y2="5" stroke="#0052FF" stroke-width="2" />
  </g>
</svg>
